name: Update Repo Dynamics

on:
  schedule:
    - cron: '0 1 * * *' # 每天UTC 1点（北京 9 点）刷新仓库动态
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/update_dynamics.py'

permissions:
  contents: write

concurrency:
  group: update-repo-dynamics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate repo dynamics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_dynamics.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "动态区块无变化，跳过提交"
          else
            git commit -m "🤖 chore: 自动更新仓库动态"
            git push
          fi
