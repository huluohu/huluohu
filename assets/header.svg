<svg xmlns="http://www.w3.org/2000/svg" width="850" height="220" viewBox="0 0 850 220" fill="none">
  <!-- 背景：深色科技渐变 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b33"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f778ba" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="850" height="220" rx="14" fill="url(#bgGrad)"/>

  <!-- 装饰网格 -->
  <g stroke="#30363d" stroke-width="0.6" opacity="0.35">
    <path d="M0 44 H850 M0 88 H850 M0 132 H850 M0 176 H850"/>
    <path d="M85 0 V220 M170 0 V220 M255 0 V220 M340 0 V220 M425 0 V220 M510 0 V220 M595 0 V220 M680 0 V220 M765 0 V220"/>
  </g>

  <!-- 顶部渐变光线 -->
  <rect x="0" y="0" width="850" height="3" rx="1.5" fill="url(#accentGrad)"/>

  <!-- 角落装饰 -->
  <g opacity="0.55" stroke="url(#accentGrad)" stroke-width="2" fill="none">
    <path d="M22 40 V22 H40"/>
    <path d="M810 180 V198 H792"/>
  </g>

  <!-- 主标题 -->
  <text x="60" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#e6edf3" filter="url(#glow)">Hi, I'm
    <tspan fill="#a371f7" font-weight="800"> huluohu</tspan>
  </text>

  <!-- 中文标语 -->
  <text x="62" y="118" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#c9d1d9">细嗅蔷薇，心有哈士奇 🐺</text>

  <!-- 打字机效果行：终端提示符 + 三段轮播 -->
  <g>
    <rect x="60" y="140" width="24" height="24" rx="5" fill="#1f6feb" opacity="0.85"/>
    <text x="66" y="157" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#ffffff">&gt;_</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="600" fill="#e6edf3">
    <text x="96" y="158" opacity="0">
      Building Ottr · AI-native server manager
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.10;0.42;0.50;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="96" y="158" opacity="0">
      Self-hosting enthusiast · NAS &amp; homelab
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.43;0.75;0.83;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="96" y="158" opacity="0">
      TypeScript · Rust · Vue · AI Apps
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.69;0.76;0.95;1;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- 闪烁光标 -->
  <rect x="404" y="144" width="9" height="18" fill="#f778ba">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- 底部装饰线 -->
  <rect x="60" y="186" width="730" height="1.5" rx="0.75" fill="url(#lineGrad)"/>
</svg>
